[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mplbm_utils"
version = "1.0"
description = "Utilities for the MPLBM-UT lattice-Boltzmann simulator."
authors = [
    { name = "Alex Gigliotti", email = "alex.gigliotti@utexas.edu" },
    { name = "Javier Santos" },
]
maintainers = [
    { name = "Bernard Chang", email = "bcchang@utexas.edu" },
]
requires-python = ">=3.8"
keywords = ["python", "lattice boltzmann method", "lattice boltzmann", "digital rocks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "porespy",
    "numpy",
    "pyyaml",
    "vedo",
    "pyvista",
    "matplotlib",
    "scikit-image",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
