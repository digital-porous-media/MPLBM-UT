simulation type: "1-phase"  # "1-phase" or "2-phase"

input output:
  # Full path to simulation directory (run pwd command in simulation directory and paste output here)
  simulation directory: "."
  input folder: "../input/"
  output folder: "sim_output/"

geometry:
  file name: "rg_theta30_phi30_micromodel.raw" # Name of the input geometry file
  data type: uint8
  geometry size:
    Nx: 5
    Ny: 150
    Nz: 200

domain:
  geom name: "rg_theta30_phi30"  # Name of .dat file, rename from original if you'd like. Do not include the file extension.
  domain size:
    nx: 200
    ny: 150
    nz: 5
  periodic boundary:
    x: True
    y: False
    z: False
  inlet and outlet layers: 4
  add mesh: False  # Add neutral mesh, by default False --> Not yet implemented
  swap xz: True  # False by default
  double geom resolution: False  # False by default

simulation:
  num procs: 128  # Number of processors to run on
  num geoms: 1  # Total number of geometries / individual simulations (this will be used once two-phase rel perm python code is done)
  pressure: 0.0005
  max iterations: 2000000
  convergence: 1e-6
  save vtks: True

visualization:  # coming soon
